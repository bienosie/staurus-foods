name: CloudNext SFTP preflight (read-only)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Discover host fingerprint, or inspect using independently verified pinned key
        required: true
        type: choice
        options: [discover, inspect]
        default: discover
      directory:
        description: Existing directory to inspect (metadata only)
        required: true
        default: '.'
        type: string
permissions:
  contents: read
jobs:
  discover:
    if: inputs.operation == 'discover'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the RSA host key fingerprint against CloudNext support confirmation
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          VERIFIED_RSA_SHA256: 'SHA256:hKxyk+232nxSLX/gRKox2f3tvTvDOHAu/BMcGMG9cNc'
        shell: bash
        run: |
          set -euo pipefail
          HOST="${SFTP_HOST:-ssh.gb.stackcp.com}"
          if [[ "$HOST" != "ssh.gb.stackcp.com" ]]; then
            echo "Unexpected host. CloudNext has verified only ssh.gb.stackcp.com."
            exit 1
          fi
          ssh-keyscan -T 15 -p 22 -t rsa "$HOST" > /tmp/observed_rsa_hostkey
          test -s /tmp/observed_rsa_hostkey
          OBSERVED="$(ssh-keygen -lf /tmp/observed_rsa_hostkey -E sha256 | awk '{print $2}')"
          echo "Observed RSA host-key fingerprint for the configured endpoint: $OBSERVED"
          echo "CloudNext support-provided fingerprint: $VERIFIED_RSA_SHA256"
          if [[ "$OBSERVED" != "$VERIFIED_RSA_SHA256" ]]; then
            echo "STOP: RSA host key does not match CloudNext's confirmed fingerprint."
            echo "Request CloudNext to confirm the fingerprint for the exact configured SSH hostname and port."
            exit 1
          fi
          echo "PASS: observed RSA public host key matches the fingerprint confirmed by CloudNext support."
          echo "Copy the following PUBLIC host-key line to the SFTP_KNOWN_HOSTS secret:"
          cat /tmp/observed_rsa_hostkey
          echo "Do not use this check as proof that SFTP authentication or document paths work."
  inspect:
    if: inputs.operation == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-deploy.txt
      - name: Verify host identity and list remote metadata only
        run: python scripts/sftp_preflight.py
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: '22'
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          INSPECT_DIRECTORY: ${{ inputs.directory }}
