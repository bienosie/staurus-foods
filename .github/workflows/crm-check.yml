name: Phase 2 buyer CRM checks
on:
  workflow_dispatch:
    inputs:
      verify_staging:
        description: Read-only HTTP verification of the deployed shea butter CRM bundle
        type: boolean
        default: false
  push:
    paths: ['crm/**', 'supabase/migrations/**', 'site/api/**', 'site/assets/main.js', 'tests/**', '.github/workflows/crm-check.yml']
  pull_request:
    paths: ['crm/**', 'supabase/migrations/**', 'site/api/**', 'site/assets/main.js', 'tests/**', '.github/workflows/crm-check.yml']
permissions:
  contents: read
jobs:
  protected-staging-http:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_staging && github.ref == 'refs/heads/feature/phase-2-buyer-crm'
    environment: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild the exact deployed source without credentials
        env:
          SF_CRM_URL: https://fpseihhfrkhpbmpahqgm.supabase.co
          SF_CRM_PUBLISHABLE_KEY: sb_publishable_88jdiBAo13pn4rigd6QyOw_LdYze293
          SF_CRM_AUTH_FILE: /home/sites/10b/f/ffe8ba666a/private-auth/.htpasswd.txt
        run: |
          git merge-base --is-ancestor 7c8635486ca85df1c0cecdc30d820cbb6770f99a HEAD
          git worktree add --detach "$RUNNER_TEMP/crm-staging-source" 7c8635486ca85df1c0cecdc30d820cbb6770f99a
          cd "$RUNNER_TEMP/crm-staging-source"
          node crm/scripts/build-staging.mjs
      - name: Verify protected HTTP files without buyer writes
        env:
          PREVIEW_HTTP_USER: ${{ secrets.PREVIEW_HTTP_USER || 'staurus-preview' }}
          PREVIEW_HTTP_PASSWORD: ${{ secrets.PREVIEW_HTTP_PASSWORD }}
        run: |
          python crm/scripts/verify-staging-http.py --bundle "$RUNNER_TEMP/crm-staging-source/dist/crm-staging-7c8635486ca85df1c0cecdc30d820cbb6770f99a" > crm-http-verification.json
          cat crm-http-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: crm-protected-http-verification
          path: crm-http-verification.json
          retention-days: 30
  isolated-crm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci
        working-directory: crm
      - run: npm run check && npm test
        working-directory: crm
      - run: python -m unittest discover -s crm/tests -p 'test_*.py' -v
      - name: PHP syntax and isolated transport checks
        run: |
          php -l site/api/enquiry.php
          php -l site/api/crm.php
          python -m unittest discover -s tests -v
      - name: Verify unchanged release packaging controls
        run: |
          python scripts/build.py --output dist/preview --sha "$GITHUB_SHA" --preview
          python scripts/build.py --output dist/production --sha "$GITHUB_SHA"
  postgres-http:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sf_crm_test
          POSTGRES_PASSWORD: sf_fixture_only
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sf_crm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SF_CRM_TEST_MODE: ephemeral-ci
      PGHOST: 127.0.0.1
      PGPORT: '55432'
      PGUSER: postgres
      PGPASSWORD: sf_fixture_only
      PGDATABASE: sf_crm_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci
        working-directory: crm
      - name: Initialise disposable database
        run: node tests/http/prepare.mjs --prepare
        working-directory: crm
      - name: Start local PostgREST
        run: |
          docker run -d --name sf-crm-postgrest --network host \
            -e PGRST_DB_URI=postgres://authenticator:sf_fixture_only@127.0.0.1:55432/sf_crm_test \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET=staurus-foods-ci-only-signing-key-0000000000000000 \
            -e PGRST_SERVER_HOST=127.0.0.1 \
            -e PGRST_SERVER_PORT=33000 \
            postgrest/postgrest:v16.6
      - name: Exercise real database HTTP contracts
        run: node --test tests/http/postgrest.test.mjs
        working-directory: crm
      - name: Stop disposable API
        if: always()
        run: docker rm -f sf-crm-postgrest || true
