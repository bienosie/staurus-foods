name: Staurus Foods pinned preview verification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed 40-character source commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cloudnext-deployment
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main' && vars.PREVIEW_ENABLED == 'true'
    environment: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the reviewed ancestor commit
        env:
          REVIEWED_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          sha = os.environ['REVIEWED_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise ValueError('A full commit SHA is required')
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD'], check=True)
          subprocess.run(['git', 'checkout', '--detach', sha], check=True)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the pinned source
        run: python -m unittest discover -s tests -v
      - name: Build pinned preview
        env:
          REVIEWED_SHA: ${{ inputs.source_sha }}
        run: python scripts/build.py --output dist/preview --sha "$REVIEWED_SHA" --preview
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-preview-${{ inputs.source_sha }}
          path: dist/preview/
          retention-days: 90
      - run: python -m pip install -r requirements-deploy.txt
      - name: Upload and checksum-verify immutable preview
        run: python scripts/deploy.py --bundle dist/preview
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          PREVIEW_DIR: ${{ vars.PREVIEW_DIR }}
          PRODUCTION_DIR: ${{ vars.PRODUCTION_DIR }}
          PREVIEW_PROTECTION_VERIFIED: ${{ vars.PREVIEW_PROTECTION_VERIFIED }}
      - name: Verify authenticated HTTP pages, assets and protection
        env:
          REVIEWED_SHA: ${{ inputs.source_sha }}
          PREVIEW_HTTP_USER: ${{ secrets.PREVIEW_HTTP_USER || 'staurus-preview' }}
          PREVIEW_HTTP_PASSWORD: ${{ secrets.PREVIEW_HTTP_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request, urllib.error
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          sha = os.environ['REVIEWED_SHA']
          root = 'https://preview.staurusfoods.com/'
          base = root + sha + '/'
          user = os.environ.get('PREVIEW_HTTP_USER', '')
          password = os.environ.get('PREVIEW_HTTP_PASSWORD', '')
          if not user or not password:
              raise SystemExit('Preview uploaded. Secure authentication required: configure the PREVIEW_HTTP_PASSWORD repository secret (PREVIEW_HTTP_USER is optional), then rerun this workflow. Production must remain disabled.')
          token = base64.b64encode((user + ':' + password).encode()).decode()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def get(url, auth=None):
              if urlsplit(url).scheme != 'https' or urlsplit(url).hostname not in {'preview.staurusfoods.com', 'staurusfoods.com'}:
                  raise ValueError('Unexpected HTTP target')
              headers = {'User-Agent': 'StaurusFoods-Preview-Verification/1.0', 'Cache-Control': 'no-cache'}
              if auth:
                  if urlsplit(url).hostname != 'preview.staurusfoods.com':
                      raise ValueError('Preview credentials cannot be sent to another host')
                  headers['Authorization'] = 'Basic ' + auth
              try:
                  with opener.open(urllib.request.Request(url, headers=headers), timeout=30) as response:
                      return response.status, response.headers, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.headers, b''
          status, headers, _ = get(base)
          assert status == 401 and headers.get('WWW-Authenticate', '').startswith('Basic'), 'Anonymous access must require Basic authentication'
          invalid = base64.b64encode(b'diagnostic-invalid:diagnostic-invalid').decode()
          assert get(base, invalid)[0] == 401, 'Incorrect credentials must be rejected'
          expected = json.loads(pathlib.Path('dist/preview/release.json').read_text())
          status, _, data = get(base + 'release.json', token)
          assert status == 200, 'Authenticated manifest access failed'
          assert json.loads(data) == expected, 'HTTP preview manifest differs from the reviewed bundle'
          pages = 0
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.robots = []; self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'meta' and attrs.get('name', '').lower() == 'robots':
                      self.robots.append(attrs.get('content', '').lower())
                  if tag in {'a', 'link', 'img', 'script'}:
                      self.links.append(attrs.get('href') or attrs.get('src') or '')
          for rel, checksum in expected['files'].items():
              path = pathlib.PurePosixPath(rel)
              assert not path.is_absolute() and '..' not in path.parts and not urlsplit(rel).scheme
              status, headers, data = get(base + rel, token)
              if rel.endswith('.php'):
                  assert status == 403, 'Preview PHP endpoint must reject submissions: ' + rel
                  # PHP source hashes are verified over SFTP; HTTP must execute the disabled stub.
                  request = urllib.request.Request(base + rel, data=b'test=blocked', headers={'Authorization': 'Basic ' + token, 'Content-Type': 'application/x-www-form-urlencoded'}, method='POST')
                  try:
                      with opener.open(request, timeout=30) as response:
                          post_status, post_data = response.status, response.read()
                  except urllib.error.HTTPError as error:
                      post_status, post_data = error.code, error.read()
                  assert post_status == 403 and json.loads(post_data).get('success') is False, 'Preview submission is not disabled'
                  continue
              assert status == 200, 'Authenticated preview file failed: ' + rel
              assert hashlib.sha256(data).hexdigest() == checksum, 'HTTP checksum mismatch: ' + rel
              assert 'noindex' in headers.get('X-Robots-Tag', '').lower(), 'Preview header missing: ' + rel
              if rel.endswith('.html'):
                  pages += 1
                  parser = Page(); parser.feed(data.decode())
                  assert any('noindex' in rule for rule in parser.robots), 'HTML noindex missing: ' + rel
                  text = data.decode()
                  assert "form-action 'none'" in text and 'e.stopImmediatePropagation()' in text, 'Preview form controls missing: ' + rel
                  for link in parser.links:
                      parsed = urlsplit(link)
                      if parsed.scheme or parsed.netloc or not parsed.path:
                          continue
                      assert parsed.path in expected['files'], 'Broken local preview link in ' + rel
          assert get(root, token)[0] == 403, 'Preview directory listing must remain disabled'
          for path in ['private-auth/.htpasswd.txt', 'private-backups/']:
              assert get('https://staurusfoods.com/' + path)[0] in {403, 404}, 'Private directory exposed'
          print('PASS: authenticated HTTP checks, immutable file hashes, internal links, anonymous/incorrect credential rejection, noindex, disabled preview forms and private path protection.')
          print('Reviewed preview SHA: ' + sha)
          print('Verified HTML pages: ' + str(pages))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Protected preview verified: ' + base + '\\n')
              summary.write('HTML pages: ' + str(pages) + '\\n')
              summary.write('Anonymous/invalid authentication: 401. Authenticated bundle: 200 and exact checksum parity.\\n')
          PY

      - name: Install screenshot review browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture desktop and mobile review of all pages
        env:
          REVIEWED_SHA: ${{ inputs.source_sha }}
          PREVIEW_HTTP_USER: ${{ secrets.PREVIEW_HTTP_USER || 'staurus-preview' }}
          PREVIEW_HTTP_PASSWORD: ${{ secrets.PREVIEW_HTTP_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, re, time
          from playwright.sync_api import sync_playwright
          sha = os.environ['REVIEWED_SHA']
          base = 'https://preview.staurusfoods.com/' + sha + '/'
          output = pathlib.Path('screenshots')
          output.mkdir()
          report = []
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for label, viewport in [('desktop',{'width':1440,'height':1000}),('mobile',{'width':390,'height':844})]:
                  context = browser.new_context(viewport=viewport,
                      user_agent='StaurusFoods-Preview-Verification/1.0',
                      extra_http_headers={'Cache-Control':'no-cache'})
                  # Send Basic auth pre-emptively only to the protected preview origin.
                  # Never attach the header to external fonts or other hosts.
                  token = base64.b64encode((os.environ['PREVIEW_HTTP_USER'] + ':' + os.environ['PREVIEW_HTTP_PASSWORD']).encode()).decode()
                  # Pace the review below CloudNext's anti-abuse request threshold.
                  # Authentication routing disables the browser HTTP cache, so repeated
                  # pages otherwise create an artificial image-request burst.
                  def authorized_request(route):
                      time.sleep(1.5)
                      route.continue_(headers={**{k:v for k,v in route.request.headers.items() if k.lower() != 'authorization'},'authorization':'Basic ' + token})
                  context.route('https://preview.staurusfoods.com/**',authorized_request)
                  page = context.new_page()
                  page.on('response', lambda response: print('Image response:',response.status,response.url) if response.request.resource_type == 'image' else None)
                  for name in sorted(path.name for path in pathlib.Path('dist/preview').glob('*.html')):
                      response = page.goto(base + name, wait_until='networkidle')
                      if response.status != 200:
                          page.screenshot(path=str(output/(label + '-access-error.png')),full_page=True)
                          safe_headers = {k:v for k,v in response.headers.items() if k.lower() in {'server','x-origin-cache-status','x-cdn-cache-status','www-authenticate','location'}}
                          print('Access diagnostic:',response.status,safe_headers)
                          print('Authorization attached:',bool(response.request.all_headers().get('authorization')))
                      assert response.status == 200, name + ': HTTP ' + str(response.status)
                      for picture in page.locator('img').all():
                          picture.scroll_into_view_if_needed()
                          print('Checking image:',label,name,picture.get_attribute('src'))
                          try:
                              picture.evaluate('(i)=>i.decode()')
                          except Exception:
                              page.screenshot(path=str(output/(label + '-' + name.replace('.html','-image-error.png'))),full_page=True)
                              raise
                      page.wait_for_function('Array.from(document.images).every(i=>i.complete && i.naturalWidth>0)')
                      page.evaluate('document.fonts.ready')
                      assert page.evaluate('document.documentElement.scrollWidth <= innerWidth'), 'Horizontal overflow: ' + name
                      item = page.locator('img[src="assets/hibiscus-product.webp"]')
                      info = None
                      if item.count():
                          info = item.evaluate('(i)=>({naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight,alt:i.alt,width:i.width,height:i.height,fit:getComputedStyle(i).objectFit})')
                          assert info['naturalWidth'] == 809 and info['naturalHeight'] == 752
                          assert info['alt']
                      footer = page.locator('footer')
                      footer.scroll_into_view_if_needed()
                      for number in ['+2348070710922', '+447892105439', '+12103294634']:
                          phone = footer.locator('a[href="tel:' + number + '"]')
                          assert phone.count() == 1 and phone.is_visible(), 'Missing phone: ' + name
                      chat = page.locator('a.whatsapp-float')
                      assert chat.count() == 1 and chat.is_visible()
                      assert chat.get_attribute('href') == 'https://wa.me/2348070710922'
                      box = chat.bounding_box()
                      assert box and box['x'] >= 0 and box['y'] >= 0
                      assert box['x'] + box['width'] <= viewport['width']
                      assert box['y'] + box['height'] <= viewport['height']
                      assert page.evaluate('document.documentElement.scrollWidth <= innerWidth'), 'Footer overflow: ' + name
                      if name == 'trade-fairs.html':
                          assert page.locator('h1').inner_text().lower() == 'international trade events'
                          assert not re.search(r'why we|rationale|why attend|reason for attending', page.locator('main').inner_text(), re.I)
                      if label == 'mobile':
                          page.locator('#menu').click()
                          assert page.locator('#navlinks').is_visible()
                          page.locator('#menu').click()
                      page.screenshot(path=str(output/(label + '-' + name.replace('.html','.png'))),full_page=True)
                      report.append({'viewport':label,'page':name,'hibiscus':info,'footer_phones':'passed','whatsapp':'https://wa.me/2348070710922','overflow':'passed'})
                  context.close()
              browser.close()
          (output/'review.json').write_text(json.dumps({'source_sha':sha,'checks':report},indent=2))
          assert len(report) == 32, 'Expected 16 pages at two viewports'
          print('PASS: 32 desktop/mobile page, footer, phone, WhatsApp, image and layout checks; screenshots ready for visual review.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hibiscus-visual-review-${{ inputs.source_sha }}
          path: screenshots/
          retention-days: 30
